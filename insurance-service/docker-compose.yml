services:
  postgres-insurance:
    image: postgres:16-alpine
    container_name: hospital-postgres-insurance
    restart: unless-stopped
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance_secret
      POSTGRES_DB: shomal_insurance
    ports:
      - "5437:5432"
    volumes:
      - postgres_insurance_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance -d shomal_insurance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_insurance_data:
